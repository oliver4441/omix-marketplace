<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb"/>
      <stop offset="100%" style="stop-color:#1d4ed8"/>
    </linearGradient>
  </defs>
  
  <!-- Logo Mark -->
  <g transform="translate(10, 10)">
    <rect width="100" height="100" rx="20" fill="url(#logoGrad)"/>
    
    <!-- Stylized O with map pin -->
    <circle cx="50" cy="42" r="22" fill="none" stroke="white" stroke-width="4"/>
    <circle cx="50" cy="42" r="8" fill="white"/>
    
    <!-- Connection lines suggesting network/map -->
    <line x1="50" y1="64" x2="50" y2="78" stroke="white" stroke-width="3" stroke-linecap="round"/>
    <circle cx="50" cy="82" r="4" fill="white" opacity="0.6"/>
  </g>
  
  <!-- Wordmark -->
  <text x="130" y="52" font-family="system-ui, -apple-system, sans-serif" font-size="42" font-weight="700" fill="white">Omix</text>
  <text x="130" y="82" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="400" fill="#94a3b8" letter-spacing="3">SYSTEMS</text>
</svg>
