<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#667eea"/>
      <stop offset="100%" style="stop-color:#764ba2"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <rect width="400" height="300" rx="20" fill="url(#bgGrad)"/>
  
  <g transform="translate(200, 150)">
    <circle r="80" fill="none" stroke="url(#accentGrad)" stroke-width="2" opacity="0.3">
      <animate attributeName="r" values="60;90;60" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.1;0.3" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle r="60" fill="none" stroke="url(#accentGrad)" stroke-width="2" opacity="0.5">
      <animate attributeName="r" values="50;70;50" dur="3s" repeatCount="indefinite"/>
    </circle>
    
    <g filter="url(#glow)">
      <rect x="-30" y="-50" width="12" height="100" rx="3" fill="url(#accentGrad)"/>
      <rect x="-12" y="-50" width="12" height="100" rx="3" fill="url(#accentGrad)" opacity="0.7"/>
      <rect x="6" y="-50" width="12" height="100" rx="3" fill="url(#accentGrad)" opacity="0.5"/>
      <rect x="24" y="-50" width="12" height="100" rx="3" fill="url(#accentGrad)" opacity="0.3"/>
    </g>
    
    <text y="95" font-family="system-ui" font-size="28" font-weight="bold" fill="white" text-anchor="middle">OMIX</text>
  </g>
  
  <circle cx="50" cy="50" r="3" fill="#667eea" opacity="0.6">
    <animate attributeName="opacity" values="0.6;0.2;0.6" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="350" cy="250" r="4" fill="#764ba2" opacity="0.5">
    <animate attributeName="opacity" values="0.5;0.1;0.5" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="320" cy="60" r="2" fill="#667eea" opacity="0.4">
    <animate attributeName="opacity" values="0.4;0.1;0.4" dur="2.5s" repeatCount="indefinite"/>
  </circle>
</svg>
