services:
  - type: web
    name: omix-marketplace
    runtime: node
    plan: free
    rootDir: .
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && npx prisma db seed && npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: omix-db
          property: connectionString
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: NEXTAUTH_URL
        value: https://omix-marketplace.onrender.com

databases:
  - name: omix-db
    plan: free
    region: frankfurt
    postgresVersion: 16
